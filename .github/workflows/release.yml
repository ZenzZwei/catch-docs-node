name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '22.15.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win-x64
            ext: .zip
            node_dist: win-x64
            node_ext: .zip
          - os: macos-latest
            name: macos-arm64
            ext: .tar.gz
            node_dist: darwin-arm64
            node_ext: .tar.gz
          - os: ubuntu-latest
            name: linux-x64
            ext: .tar.gz
            node_dist: linux-x64
            node_ext: .tar.xz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Bundle app
        run: node scripts/build-portable.mjs

      - name: Copy Playwright to dist
        shell: bash
        run: |
          cp -r node_modules/playwright dist/node_modules/
          cp -r node_modules/playwright-core dist/node_modules/

      - name: Download Node.js portable
        shell: bash
        run: |
          NODE_NAME="node-v${{ env.NODE_VERSION }}-${{ matrix.node_dist }}"
          curl -fsSL "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/${NODE_NAME}${{ matrix.node_ext }}" -o node-portable${{ matrix.node_ext }}

          if [[ "${{ matrix.node_ext }}" == ".zip" ]]; then
            unzip -q node-portable.zip
            mkdir -p dist/node
            cp "${NODE_NAME}/node.exe" dist/node/
          elif [[ "${{ matrix.node_ext }}" == ".tar.xz" ]]; then
            tar -xf node-portable.tar.xz
            mkdir -p dist/node/bin
            cp "${NODE_NAME}/bin/node" dist/node/bin/
          else
            tar -xzf node-portable.tar.gz
            mkdir -p dist/node/bin
            cp "${NODE_NAME}/bin/node" dist/node/bin/
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath CatchDocs-${{ matrix.name }}.zip

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: tar -czf CatchDocs-${{ matrix.name }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatchDocs-${{ matrix.name }}
          path: CatchDocs-${{ matrix.name }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}" \
            artifacts/**/*
